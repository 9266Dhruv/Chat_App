spring:
  application:
    name: chatapp-backend

  # H2 File-Based Database (Saves data permanently to a local file)
  datasource:
    url: jdbc:h2:file:./chatdb
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

app:
  jwt:
    secret: c2VjcmV0S2V5Rm9yQ2hhdEFwcEp3dFRva2VuU2lnbmluZzEyMzQ1Njc4OTAxMjM0NTY3ODkw
    expiration-ms: 900000  # 15 minutes

file:
  upload-dir: ./uploads


